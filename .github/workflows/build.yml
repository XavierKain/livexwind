name: Build (contrôle sans signature)

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Tests des parseurs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Parseurs sur réponses réelles enregistrées
        run: python3 -m unittest discover -s tests -v

  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate
        env:
          APPLE_TEAM_ID: ""
          BUILD_NUMBER: "1"

      - name: Build for iOS Simulator (no signing)
        # On garde le journal complet : un `tail` avalait les diagnostics du
        # compilateur, noyés sous les lignes de commande de clang.
        run: |
          set -o pipefail
          if ! xcodebuild build \
            -project LiveXWind.xcodeproj \
            -scheme LiveXWind \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            > /tmp/build.log 2>&1; then
              echo "::group::Erreurs de compilation"
              grep -E "error:" /tmp/build.log | sort -u | head -40
              echo "::endgroup::"
              tail -30 /tmp/build.log
              exit 1
          fi
          tail -3 /tmp/build.log
