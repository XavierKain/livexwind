name: Build (contrôle sans signature)

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate
        env:
          APPLE_TEAM_ID: ""
          BUILD_NUMBER: "1"

      - name: Build for iOS Simulator (no signing)
        run: |
          set -o pipefail
          xcodebuild build \
            -project LiveXWind.xcodeproj \
            -scheme LiveXWind \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            | tail -80
