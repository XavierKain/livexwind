name: TestFlight status

on:
  workflow_dispatch:
    inputs:
      lane:
        description: "Lane fastlane"
        default: status
        type: choice
        options: [status, diag, reinvite]

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: État TestFlight
        run: bundle exec fastlane ${{ inputs.lane }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
