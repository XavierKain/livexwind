name: LiveXWind
options:
  deploymentTarget:
    iOS: "17.2"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    VERSIONING_SYSTEM: "apple-generic"
    DEVELOPMENT_TEAM: "${APPLE_TEAM_ID}"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Distribution"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  LiveXWind:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xavierkain.livexwind
        PROVISIONING_PROFILE_SPECIFIER: "match AppStore com.xavierkain.livexwind"
        CODE_SIGN_IDENTITY: "Apple Distribution"
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": "Apple Distribution"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: LiveXWind
    entitlements:
      path: App/LiveXWind.entitlements
      properties:
        aps-environment: production
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: LiveXWind
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        # Le serveur de push est joint en HTTP sur le réseau privé Tailscale.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIBackgroundModes:
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.xavierkain.livexwind.refresh
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: "Pour proposer les balises autour de toi quand tu ajoutes un spot."

    dependencies:
      - target: LiveXWindWidget
        embed: true
      - target: LiveXWindWatch
        embed: true

  LiveXWindWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xavierkain.livexwind.widget
        PROVISIONING_PROFILE_SPECIFIER: "match AppStore com.xavierkain.livexwind.widget"
        CODE_SIGN_IDENTITY: "Apple Distribution"
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": "Apple Distribution"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: true
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Vent balise
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  LiveXWindWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Watch/WatchApp.swift
      - path: Watch/WatchSpotsView.swift
      - path: Watch/WatchFeed.swift
      - path: Watch/Assets.xcassets
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xavierkain.livexwind.watchkitapp
        PROVISIONING_PROFILE_SPECIFIER: "match AppStore com.xavierkain.livexwind.watchkitapp"
        CODE_SIGN_IDENTITY: "Apple Distribution"
        "CODE_SIGN_IDENTITY[sdk=watchos*]": "Apple Distribution"
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: true
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: LiveXWind
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.xavierkain.livexwind
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    dependencies:
      - target: LiveXWindWatchWidget
        embed: true

  LiveXWindWatchWidget:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Watch/WatchComplication.swift
      - path: Watch/WatchFeed.swift
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xavierkain.livexwind.watchkitapp.widget
        PROVISIONING_PROFILE_SPECIFIER: "match AppStore com.xavierkain.livexwind.watchkitapp.widget"
        CODE_SIGN_IDENTITY: "Apple Distribution"
        "CODE_SIGN_IDENTITY[sdk=watchos*]": "Apple Distribution"
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: true
    info:
      path: Watch/WidgetInfo.plist
      properties:
        CFBundleDisplayName: Vent
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
